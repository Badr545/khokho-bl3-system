version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: khokho_redis
    restart: always
    volumes:
      - redis_data:/data

  lavalink:
    image: fredboat/lavalink:latest
    container_name: khokho_lavalink
    restart: always
    ports:
      - "2333:2333"
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml
    environment:
      - _JAVA_OPTIONS=-Xmx1G

  bot:
    build: .
    container_name: khokho_bot
    restart: always
    depends_on:
      - redis
      - lavalink
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      LAVALINK_HOST: lavalink
    volumes:
      - ./data:/app/data

  backend:
    build: ./web/backend
    container_name: khokho_backend
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - redis
    env_file: .env
    environment:
      DATA_DIR: /app/data
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./data:/app/data

  frontend:
    build:
      context: ./web/frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
        NEXT_PUBLIC_DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
    container_name: khokho_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      API_BASE_URL: http://backend:8000/api/v1

volumes:
  redis_data: